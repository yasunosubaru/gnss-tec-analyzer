name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJ: src/GnssTec.App/GnssTec.App.csproj

jobs:
  build:
    # 必须用 windows-2025（Server 2025 / build 26100）。
    # windows-2022 是 Server 2022（build 17763），低于本应用要求的
    # Windows 10 19041+，进程会既不启动也不退出的挂住。
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # unpackaged WinUI 3 应用靠 bootstrapper 找 Windows App SDK 运行时。
      # 托管 runner 镜像里不一定有，缺了会弹安装对话框并挂死。
      # 装不上不算失败（继续往下走），但会留下明确记录。
      - name: Ensure Windows App SDK runtime
        shell: pwsh
        run: |
          $url = "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe"
          $msi = "$env:TEMP\WindowsAppRuntimeInstall.msix"
          $ok = $false
          try {
            Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing -TimeoutSec 180
            Add-AppxPackage -Path $msi -ErrorAction Stop
            "已安装 Windows App SDK 运行时 (MSIX)"
            $ok = $true
          } catch {
            "MSIX 安装未成功: $($_.Exception.Message)"
          }
          if (-not $ok) {
            try {
              $exe = "$env:TEMP\WindowsAppRuntimeInstall.exe"
              Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing -TimeoutSec 180
              Start-Process -FilePath $exe -ArgumentList "--quiet" -Wait
              "已安装 Windows App SDK 运行时 (exe)"
            } catch {
              "运行时安装失败，继续执行；若后续自测超时即为此原因: $($_.Exception.Message)"
            }
          }

      - name: Restore
        run: dotnet restore "$env:PROJ" -p:Platform=x64

      - name: Build
        run: dotnet build "$env:PROJ" -c Release -p:Platform=x64 --no-restore

      - name: Publish
        run: >
          dotnet publish "$env:PROJ" -c Release -p:Platform=x64 -r win-x64
          --self-contained false -o out/publish --no-restore

      # 冒烟测试：不带数据跑 --selftest，验证可执行文件能启动、参数被正确解析、
      # 且在缺数据时给出明确错误而不是崩溃或挂死。
      #
      # 本项目**不合成样本数据**：TEC 需要成对的 L1+L2 伪距/载波相位，
      # 星座与信号码编码在 status 位域里，要造出物理量级正确的 TEC 值必须
      # 先确认 Adr 字段的准确语义。与其放一个会产出误导性 TEC 数字的假样本，
      # 不如不放。逐字节对拍需自行提供真实 BFN 数据，见 README §4.1。
      #
      # 用 Start-Process -PassThru 拿 ExitCode 而不是 $LASTEXITCODE：WinExe
      # （GUI 子系统）在 pwsh 里 $LASTEXITCODE 实测可能为 $null。
      # 必须自己等超时：缺运行时/缺显示环境时进程会挂死而非返回。
      - name: Smoke test (no data)
        shell: pwsh
        run: |
          $exe = "out/publish/GnssTec.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $log = "out/smoke.txt"
          $p = Start-Process -FilePath $exe `
               -ArgumentList @("--selftest", "0", "nonexistent.bin", "out") `
               -NoNewWindow -PassThru `
               -RedirectStandardOutput $log -RedirectStandardError "out/smoke.err"
          if (-not $p.WaitForExit(120000)) {
            try { $p.Kill() } catch {}
            "自测超时 120s。已输出："
            if (Test-Path $log) { Get-Content $log -TotalCount 20 }
            throw "selftest 120s 未退出（多为缺 Windows App SDK 运行时）"
          }
          "exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -TotalCount 10 }
          if (Test-Path "out/smoke.err") {
            $e = Get-Content "out/smoke.err" -TotalCount 5
            if ($e) { "stderr:"; $e }
          }
          # 缺数据时应返回非 0（明确错误），而不是 0（假装成功）或挂死
          if ($p.ExitCode -eq 0) { throw "缺数据时不应返回 0" }

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $stage = "out/GnssTec-$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item out/publish/* $stage -Recurse -Force
          Copy-Item README.md, LICENSE, nuget.config $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "out/GnssTec-$ver.zip" -Force
          Get-ChildItem out -Filter *.zip | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GnssTec-win-x64
          path: out/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GnssTec-win-x64
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
